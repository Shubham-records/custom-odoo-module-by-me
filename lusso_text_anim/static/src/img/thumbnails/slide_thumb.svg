<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#0f0e0d"/>
  <!-- Row 1: center-aligned -->
  <text x="150" y="90" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="52" fill="#d4b896" letter-spacing="-2">Blooming</text>
  <!-- Row 2: center with slight opacity to hint at scroll-in -->
  <text x="150" y="155" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="52" fill="rgba(212,184,150,0.55)" letter-spacing="-2">flowers</text>
  <!-- Small label -->
  <text x="150" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="rgba(212,184,150,0.4)">Slide Animation</text>
</svg>
