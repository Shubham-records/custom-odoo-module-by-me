<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#fafaf8"/>
  <!-- Decorative layout lines -->
  <rect x="20" y="28" width="120" height="10" rx="5" fill="#1a1a18" opacity="0.15"/>
  <rect x="20" y="46" width="180" height="18" rx="4" fill="#1a1a18" opacity="0.7"/>
  <rect x="20" y="72" width="160" height="8" rx="4" fill="#1a1a18" opacity="0.2"/>
  <rect x="20" y="86" width="140" height="8" rx="4" fill="#1a1a18" opacity="0.15"/>
  <rect x="20" y="108" width="80" height="28" rx="14" fill="#1847f0" opacity="0.9"/>
  <rect x="108" y="108" width="70" height="28" rx="14" fill="none" stroke="#1a1a18" stroke-width="1.5" opacity="0.3"/>
  <!-- Image placeholder -->
  <rect x="190" y="20" width="92" height="120" rx="12" fill="#1847f0" opacity="0.12"/>
  <rect x="198" y="28" width="76" height="104" rx="8" fill="#1a1a18" opacity="0.08"/>
  <!-- Tag chip -->
  <rect x="198" y="104" width="76" height="32" rx="8" fill="#fafaf8" opacity="0.95" filter="url(#s)"/>
  <rect x="204" y="110" width="40" height="6" rx="3" fill="#1847f0" opacity="0.7"/>
  <rect x="204" y="120" width="60" height="5" rx="2.5" fill="#1a1a18" opacity="0.5"/>
  <!-- Label -->
  <text x="20" y="165" font-family="serif" font-size="11" fill="#1a1a18" opacity="0.4" font-style="italic">Stats Light</text>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="black" flood-opacity="0.12"/>
    </filter>
  </defs>
</svg>